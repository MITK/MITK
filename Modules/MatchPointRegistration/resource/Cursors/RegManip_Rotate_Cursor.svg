<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Rotation cursor: circular arrow -->
  <g stroke="#00ADFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arc (top-right to bottom-left, roughly 270 degrees) -->
    <path d="M 22,8 A 10,10 0 1,1 8,14"/>
    <!-- Arrowhead at start of arc -->
    <polyline points="22,13 22,8 27,8"/>
    <!-- Arrowhead at end of arc -->
    <polyline points="3,14 8,14 8,19"/>
  </g>
</svg>
