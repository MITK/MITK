<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Translation cursor: four-directional arrows -->
  <g stroke="#00ADFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Up arrow -->
    <line x1="16" y1="4" x2="16" y2="28"/>
    <polyline points="11,9 16,4 21,9"/>
    <polyline points="11,23 16,28 21,23"/>
    <!-- Left-right arrow -->
    <line x1="4" y1="16" x2="28" y2="16"/>
    <polyline points="9,11 4,16 9,21"/>
    <polyline points="23,11 28,16 23,21"/>
  </g>
</svg>
